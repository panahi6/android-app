<!doctype html>
<!-- Voice notes: listens in Hebrew, saves what is said after "תרשום" with the time. -->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5e35b1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>פתקים קוליים</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #111; transition: background .2s; }
  body.catching { background: #fff59d; }
  body.saved { background: #c8e6c9; }
  button { font-size: 1.2rem; padding: 14px; margin: 4px 0; width: 100%; border-radius: 10px; border: 1px solid #888; }
  #toggle.on { background: #c62828; color: #fff; }
  #status { margin: 8px 0; color: #555; }
  #clock { font-size: 2.5rem; text-align: center; font-variant-numeric: tabular-nums; }
  #cue { min-height: 1.5em; font-size: 1.5rem; text-align: center; font-weight: bold; }
  li { margin: 6px 0; }
  .time { color: #777; font-variant-numeric: tabular-nums; margin-left: 8px; }
  #heard { font-size: .85rem; color: #666; }
</style>
</head>
<body>
<h2>פתקים קוליים</h2>
<p>אמרי "תרשום" ואז את מה שקרה, למשל: "תרשום, הוא מחא כפיים".</p>
<button id="toggle">התחל להקשיב</button>
<div id="status">כבוי</div>
<div id="clock">00:00:00</div>
<div id="cue"></div>
<h3>פתקים</h3>
<ol id="notes"></ol>
<button id="share">שתף / הורד פתקים</button>
<button id="shareHeard">שתף / הורד תמלול מלא</button>
<button id="clear">מחק הכל</button>
<details>
  <summary>מה שנשמע</summary>
  <ul id="heard"></ul>
</details>

<script>
const TRIGGER = /תי?רש(?:ו?ם|מי|מו)/; // spellings the recognizer may use for "תרשום"
const NOTE_SECONDS = 2; // how long to keep listening after "תרשום" is caught
const notes = JSON.parse(localStorage.getItem('notes') || '[]');
const heard = JSON.parse(localStorage.getItem('heard') || '[]'); // full transcript, for backup
let listening = false, waitingUntil = 0, wakeLock = null;
let lastInterim = '', catchTimer = null, cueTimer = null, startedAt = 0, clockTimer = null;

const $ = id => document.getElementById(id);
const time = d => new Date(d).toLocaleTimeString('he-IL');

function addLine(list, entry, prepend) {
  const li = document.createElement('li');
  li.innerHTML = `<span class="time">${time(entry.t)}</span>`;
  li.append(entry.text);
  prepend ? list.prepend(li) : list.append(li);
}

function render() {
  $('notes').innerHTML = '';
  $('heard').innerHTML = '';
  notes.forEach(n => addLine($('notes'), n));
  heard.forEach(h => addLine($('heard'), h, true));
}

function cue(cls, text) {
  document.body.className = cls;
  $('cue').textContent = text;
  clearTimeout(cueTimer);
  if (cls === 'saved') cueTimer = setTimeout(() => cue('', ''), 2500);
}

function save(text) {
  notes.push({ t: Date.now(), text });
  localStorage.setItem('notes', JSON.stringify(notes)); // survives a refresh or crash
  addLine($('notes'), notes.at(-1));
  cue('saved', '✓ ' + text);
  navigator.vibrate?.([80, 60, 80]);
}

function onHeard(text) {
  heard.push({ t: Date.now(), text });
  localStorage.setItem('heard', JSON.stringify(heard));
  addLine($('heard'), heard.at(-1), true);
  // one sentence can hold several "תרשום ..." notes; the part before the first one only counts if she paused right after a trigger
  const [before, ...after] = text.split(TRIGGER);
  if (Date.now() < waitingUntil && clean(before)) save(clean(before));
  waitingUntil = 0;
  for (const part of after) {
    const note = clean(part);
    if (note) save(note);
    waitingUntil = note ? 0 : Date.now() + NOTE_SECONDS * 1000;
  }
}
const clean = s => s.replace(/^[\s,.:-]+/, '').trim();

// "תרשום" was heard: show it, then cut the sentence off NOTE_SECONDS later
function startCatch() {
  cue('catching', '✍️ רושם...');
  navigator.vibrate?.(150);
  catchTimer = setTimeout(() => rec.stop(), NOTE_SECONDS * 1000); // stop() turns what was said so far into a final result
}
function endCatch() {
  clearTimeout(catchTimer);
  catchTimer = null;
  if (document.body.className === 'catching') cue('', '');
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const rec = SR && new SR();
if (!rec) $('status').textContent = 'הדפדפן לא תומך בזיהוי דיבור. פתחי ב-Chrome.';
else {
  rec.lang = 'he-IL';
  rec.continuous = true;
  rec.interimResults = true; // partial text arrives while she speaks, so the cue shows right away
  rec.onresult = e => {
    let interim = '', gotFinal = false;
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const text = e.results[i][0].transcript;
      if (e.results[i].isFinal) { onHeard(text); gotFinal = true; } else interim += text;
    }
    if (gotFinal) endCatch();
    lastInterim = interim;
    if (interim && !catchTimer && (TRIGGER.test(interim) || Date.now() < waitingUntil)) startCatch();
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed') { stop(); $('status').textContent = 'אין הרשאה למיקרופון'; }
  };
  // Android stops listening after silence; start again while still "on"
  rec.onend = () => {
    if (lastInterim) { onHeard(lastInterim); lastInterim = ''; } // never lose words that did not become final
    endCatch();
    if (!listening) return;
    try { rec.start(); } catch {}
  };
}

async function keepScreenOn() {
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (listening && document.visibilityState === 'visible') keepScreenOn();
});

function tick() {
  $('clock').textContent = new Date(Date.now() - startedAt).toISOString().slice(11, 19);
}

function start() {
  listening = true;
  $('toggle').textContent = 'עצור';
  $('toggle').classList.add('on');
  $('status').textContent = 'מקשיב...';
  rec.start();
  keepScreenOn();
  startedAt = Date.now();
  tick();
  clockTimer = setInterval(tick, 1000);
}
function stop() {
  listening = false;
  $('toggle').textContent = 'התחל להקשיב';
  $('toggle').classList.remove('on');
  $('status').textContent = 'כבוי';
  rec.stop();
  wakeLock?.release();
  clearInterval(clockTimer);
}

$('toggle').onclick = () => rec && (listening ? stop() : start());

async function share(title, list, fileName) {
  const text = list.map(n => `${time(n.t)} - ${n.text}`).join('\n');
  if (navigator.share) { try { await navigator.share({ title, text }); return; } catch {} }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
  a.download = `${fileName}-${new Date().toISOString().slice(0, 10)}.txt`;
  a.click();
}
$('share').onclick = () => share('פתקים', notes, 'notes');
$('shareHeard').onclick = () => share('תמלול מלא', heard, 'transcript');

$('clear').onclick = () => {
  if (!confirm('למחוק את כל הפתקים והתמלול?')) return;
  notes.length = 0;
  heard.length = 0;
  localStorage.removeItem('notes');
  localStorage.removeItem('heard');
  render();
};

render();
</script>
</body>
</html>
